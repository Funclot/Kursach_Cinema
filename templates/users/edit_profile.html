{% extends 'base.html' %}

{% block title %}
Редактирование профиля
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">

    <div class="col-md-8">

        <div class="card shadow border-0 mb-0">

            <div class="card-header bg-dark text-white text-center py-4">

                <h2 class="mb-0 fw-bold">
                    Редактирование профиля
                </h2>

            </div>

        </div>

        <div class="card shadow border-0 rounded-top-0">

            <div class="card-body p-4">

                <form method="post"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Аватар
                        </label>

                        {{ form.avatar }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Телефон
                        </label>

                        {{ form.phone }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            О себе
                        </label>

                        {{ form.bio }}

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-custom">

                            <i class="bi bi-check-circle"></i>
                            Сохранить

                        </button>

                        <a href="{% url 'profile' %}"
                           class="btn btn-back">

                            <i class="bi bi-arrow-left"></i>
                            Отмена

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<style>
.card:hover {
    transform: none !important;
}
</style>

{% endblock %}
