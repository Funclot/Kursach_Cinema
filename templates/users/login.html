{% extends 'base.html' %}

{% block title %}
Вход
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-6 col-lg-5">

        <div class="card login-card shadow border-0">

            <div class="card-header bg-dark text-white text-center py-4">

                <h2 class="mb-0 fw-bold">
                    CinemaHub | Авторизация
                </h2>

            </div>

            <div class="card-body p-5">
                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Логин
                        </label>

                        {{ form.username }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Пароль
                        </label>

                        {{ form.password }}

                    </div>

                    <button
                            type="submit"
                            class="btn btn-custom w-20">

                        Войти

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
<style>
.login-card:hover {
    transform: none !important;

}
</style>

{% endblock %}
