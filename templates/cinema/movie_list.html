{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

<h2>{{ title }}</h2>

{% for movie in movies %}
    <h3>
    <a href="{% url 'movie_detail' movie.id %}">
        {{ movie.title }}
    </a>
    </h3>
{% empty %}
    <p>Фильмов пока нет</p>
{% endfor %}

{% endblock %}
