{% extends 'base.html' %}

{% block title %}
    {{ movie.title }}
{% endblock %}

{% block content %}

<h2>{{ movie.title }}</h2>

<p>
    Жанр: {{ movie.genre }}
</p>

<p>
    Продолжительность:
    {{ movie.duration }} мин.
</p>

<p>
    Дата выхода:
    {{ movie.release_date }}
</p>

<p>
    {{ movie.description }}
</p>

<a href="/">Назад к афише</a>

{% endblock %}
