<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

    <title>
        {% block title %}
            CinemaHub
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
                    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        .card {
            overflow: hidden;
            background: linear-gradient(
        to bottom,
        #f8fafc,
        #e2e8f0
    );
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }

        .card-body {
            background: linear-gradient(
            to bottom,
            #f8fafc,
            #e2e8f0
            );
        }
        .btn-custom {
    background: linear-gradient(
        135deg,
        #475569,
        #94a3b8
        );

    border: none;
    color: white;
        }

        .btn-custom:hover {
    background: linear-gradient(
        135deg,
        #334155,
        #64748b
        );

    color: white;
        }
    .price-tag {
    background: linear-gradient(
        135deg,
        #64748b,
        #94a3b8
    );



    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    font-weight: 700;
    }

        .btn-back {
    background: linear-gradient(
        135deg,
        #374151,
        #111827
    );

    color: white;
    border: none;
    }

    .btn-back:hover {
    color: white;
    opacity: 0.95;
    }
        .movie-hero {
    border-radius: 12px;
}

.movie-hero img {
    transition: 0.3s;
}

.movie-hero img:hover {
    transform: scale(1.02);
}

.movie-hero .btn-outline-light:hover {
    background: white;
    color: black;
}

    </style>

</head>

<body class="d-flex flex-column min-vh-100"
      style="
      background:
      linear-gradient(
      135deg,
      #eef2f7,
      #dbe4f0
      );">


<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">

    <div class="container">

        <a class="navbar-brand" href="/">
            CinemaHub
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">
                Главная
            </a>

            <a class="nav-link" href="{% url 'my_tickets' %}">
                <i class="bi bi-ticket-perforated"></i>
                Мои билеты
            </a>

            {% if user.is_staff %}

            <a class="nav-link" href="/admin/">
                <i class="bi bi-gear"></i>
                Админка
            </a>

            {% endif %}
            <a class="nav-link" href="{% url 'session_list' %}">
                <i class="bi bi-film"></i>
                Сеансы
            </a>
        </div>

        <div class="d-flex align-items-center ms-auto">


            <a href="{% url 'profile' %}"
               class="nav-link text-light me-3">

                <i class="bi bi-person-circle"></i>
                Профиль

            </a>


            {% if user.is_authenticated %}

            <span class="text-light fw-bold me-3">
                {{ user.username }}
            </span>

            <form method="post"
                  action="{% url 'logout' %}">
                {% csrf_token %}
                <button
                        type="submit"
                        class="btn btn-outline-light btn-sm">
                    Выйти
                </button>
            </form>

            {% else %}

            <a class="btn btn-outline-light btn-sm"
               href="{% url 'login' %}">
                Войти
            </a>

            {% endif %}

        </div>

    </div>
</nav>



<main class="container mt-4 flex-grow-1">

    {% block content %}

    {% endblock %}

</main>

    <footer class="bg-dark text-light text-center py-3 mt-auto">
        CinemaHub © 2026
    </footer>

</body>
</html>
